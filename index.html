<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="accets/favicon2.png" />
  <title>Facebook - Log in or Sign up</title>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 gap-10 px-6">
    
    <!-- Left Section -->
    <div class="flex flex-col justify-center text-center md:text-left">
      <img src="assets/logo.svg" alt="logo" class="w-60 mx-auto md:mx-0" />
      <p class="mt-4 text-xl md:text-2xl text-gray-800">
        Facebook helps you connect and share
      </p>
      <p class="text-xl md:text-2xl text-gray-800">
        with the people in your life.
      </p>
    </div>

    <!-- Right Section (Login Card) -->
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md mx-auto">
      
      <input 
        type="text" 
        placeholder="Email address or phone number"
        class="w-full mb-4 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <input 
        type="password" 
        placeholder="Password"
        class="w-full mb-4 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
        Log in
      </button>

      <p class="text-center text-sm text-blue-500 mt-4 cursor-pointer hover:underline">
        Forgotten password?
      </p>

      <hr class="my-5" />

      <div class="flex justify-center">
        <button class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition">
          Create new account
        </button>
      </div>
    </div>
  </div>

  <!-- Footer Text -->
  <div class="absolute bottom-6 text-center w-full text-sm">
    <span class="font-semibold cursor-pointer hover:underline">Create a Page</span>
    for a celebrity, brand, or business.
  </div>

</body>
</html>
